name: Check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
      - name: The single-file build is up to date
        run: |
          if ! git diff --quiet -- "Powder Toy 3D.html"; then
            echo "The built file is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  windows-app:
    # Builds the Windows program and the installer on every push, so a break in the
    # host or the Inno Setup script shows up here rather than at release time. The
    # installer is attached as a build artifact, so it can be tried before tagging.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      - name: Build the Windows program, smoke-test it and build the installer
        shell: pwsh
        run: node scripts/windows-package.mjs --version 0.0.0 --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-untagged
          path: installer/Output/*.exe
          if-no-files-found: error
